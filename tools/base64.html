<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 Encoder / Decoder - DevTools</title>
  <meta name="description" content="Fast, private client-side Base64 encoder and decoder for text, UTF-8 strings, data URIs, and files. No data is sent to any server.">
  <link rel="apple-touch-icon" sizes="180x180" href="../favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon_io/favicon-16x16.png">
  <link rel="shortcut icon" href="../favicon_io/favicon.ico">
  <link rel="icon" type="image/x-icon" href="../favicon_io/favicon.ico">
  <link rel="manifest" href="../favicon_io/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script src="../components.js"></script>
</head>
<body>
  <!-- Main Navigation (Hydrated by components.js) -->
  <header id="site-header" class="site-header"></header>

  <main class="main-content">
    <div class="container">
      <div class="tool-page-header">
        <a href="../index.html" class="back-link">&larr; Back to all tools</a>
        <div class="tool-page-title-row">
          <h1 class="tool-page-title">Base64 Encoder / Decoder</h1>
          <span class="tool-badge">Converters</span>
        </div>
        <p class="tool-page-desc">Encode text strings and binary files to Base64 format or decode Base64 back to plain text. Handles full UTF-8 characters safely.</p>
      </div>

      <!-- Controls & Options -->
      <div class="tool-options-bar" style="margin-bottom: 1.25rem;">
        <div style="display: flex; gap: 0.35rem;">
          <button id="mode-encode" class="btn-sm btn-primary">Encode</button>
          <button id="mode-decode" class="btn-sm">Decode</button>
        </div>
        <label class="option-group">
          <input type="checkbox" id="opt-url-safe">
          <span>URL-Safe Base64 (replace +/ with -_)</span>
        </label>
        <label class="option-group">
          <input type="checkbox" id="opt-live" checked>
          <span>Live conversion</span>
        </label>
      </div>

      <!-- Main Workspace -->
      <div class="tool-workspace">
        <!-- Input Panel -->
        <div class="tool-panel">
          <div class="panel-header">
            <span class="panel-title" id="input-label">Input Plain Text</span>
            <div class="panel-actions">
              <input type="file" id="file-input" style="display: none;">
              <button id="btn-upload-file" class="btn-sm">Upload File</button>
              <button id="btn-sample" class="btn-sm">Sample</button>
              <button id="btn-clear" class="btn-sm">Clear</button>
            </div>
          </div>
          <textarea id="input-text" class="tool-textarea" placeholder="Type or paste content here..." spellcheck="false"></textarea>
          <div class="panel-footer">
            <span id="input-stats">0 characters</span>
            <span id="file-info"></span>
          </div>
        </div>

        <!-- Output Panel -->
        <div class="tool-panel">
          <div class="panel-header">
            <span class="panel-title" id="output-label">Output Base64</span>
            <div class="panel-actions">
              <button id="btn-copy" class="btn-sm btn-primary">Copy</button>
              <button id="btn-download" class="btn-sm">Download</button>
              <button id="btn-swap" class="btn-sm">Swap</button>
            </div>
          </div>
          <textarea id="output-text" class="tool-textarea" placeholder="Result will appear here..." readonly spellcheck="false"></textarea>
          <div class="panel-footer">
            <span id="output-stats">0 characters</span>
            <span id="output-status">Ready</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Detailed Footer (Hydrated by components.js) -->
  <footer id="site-footer" class="site-footer"></footer>

  <script src="common.js"></script>
  <script>
    let currentMode = 'encode'; // 'encode' or 'decode'
    const inputText = document.getElementById('input-text');
    const outputText = document.getElementById('output-text');
    const modeEncode = document.getElementById('mode-encode');
    const modeDecode = document.getElementById('mode-decode');
    const inputLabel = document.getElementById('input-label');
    const outputLabel = document.getElementById('output-label');
    const optUrlSafe = document.getElementById('opt-url-safe');
    const optLive = document.getElementById('opt-live');
    const inputStats = document.getElementById('input-stats');
    const outputStats = document.getElementById('output-stats');
    const outputStatus = document.getElementById('output-status');

    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      let b64 = btoa(binary);
      if (optUrlSafe.checked) {
        b64 = b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
      return b64;
    }

    function base64ToUtf8(b64) {
      let normalized = b64.trim();
      if (optUrlSafe.checked || normalized.includes('-') || normalized.includes('_')) {
        normalized = normalized.replace(/-/g, '+').replace(/_/g, '/');
        while (normalized.length % 4) normalized += '=';
      }
      const binary = atob(normalized);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    function process() {
      const val = inputText.value;
      inputStats.textContent = `${val.length} characters`;

      if (!val) {
        outputText.value = '';
        outputStats.textContent = '0 characters';
        outputStatus.textContent = 'Ready';
        return;
      }

      try {
        if (currentMode === 'encode') {
          outputText.value = utf8ToBase64(val);
          outputStatus.textContent = 'Encoded';
        } else {
          outputText.value = base64ToUtf8(val);
          outputStatus.textContent = 'Decoded';
        }
        outputStats.textContent = `${outputText.value.length} characters`;
      } catch (err) {
        outputText.value = '';
        outputStats.textContent = '0 characters';
        outputStatus.textContent = 'Error: Invalid Base64 string';
      }
    }

    function setMode(mode) {
      currentMode = mode;
      if (mode === 'encode') {
        modeEncode.classList.add('btn-primary');
        modeDecode.classList.remove('btn-primary');
        inputLabel.textContent = 'Input Plain Text';
        outputLabel.textContent = 'Output Base64';
      } else {
        modeDecode.classList.add('btn-primary');
        modeEncode.classList.remove('btn-primary');
        inputLabel.textContent = 'Input Base64';
        outputLabel.textContent = 'Output Plain Text';
      }
      process();
    }

    modeEncode.addEventListener('click', () => setMode('encode'));
    modeDecode.addEventListener('click', () => setMode('decode'));
    inputText.addEventListener('input', () => { if (optLive.checked) process(); });
    optUrlSafe.addEventListener('change', process);

    document.getElementById('btn-copy').addEventListener('click', () => {
      copyToClipboard(outputText.value, 'Output');
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      inputText.value = '';
      outputText.value = '';
      inputStats.textContent = '0 characters';
      outputStats.textContent = '0 characters';
      outputStatus.textContent = 'Ready';
      inputText.focus();
    });

    document.getElementById('btn-swap').addEventListener('click', () => {
      const temp = outputText.value;
      if (!temp) return;
      inputText.value = temp;
      setMode(currentMode === 'encode' ? 'decode' : 'encode');
    });

    document.getElementById('btn-sample').addEventListener('click', () => {
      if (currentMode === 'encode') {
        inputText.value = 'Hello world! Antigravity DevTools provides fast, offline developer utilities.';
      } else {
        inputText.value = 'SGVsbG8gd29ybGQhIEFudGlncmF2aXR5IERldlRvb2xzIHByb3ZpZGVzIGZhc3QsIG9mZmxpbmUgZGV2ZWxvcGVyIHV0aWxpdGllcy4=';
      }
      process();
    });

    document.getElementById('btn-download').addEventListener('click', () => {
      const ext = currentMode === 'encode' ? 'b64.txt' : 'txt';
      downloadTextFile(`base64-output.${ext}`, outputText.value);
    });

    // File Upload Handler
    const fileInput = document.getElementById('file-input');
    document.getElementById('btn-upload-file').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        if (currentMode === 'encode') {
          // If encoding, read as Data URL or array buffer
          const base64Part = reader.result.split(',')[1] || reader.result;
          inputText.value = `[File: ${file.name} (${file.size} bytes)]\nLoading content...`;
          // read as text if text, or binary
          const textReader = new FileReader();
          textReader.onload = () => {
            inputText.value = textReader.result;
            process();
          };
          textReader.readAsText(file);
        } else {
          // decoding file
          const textReader = new FileReader();
          textReader.onload = () => {
            inputText.value = textReader.result;
            process();
          };
          textReader.readAsText(file);
        }
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
