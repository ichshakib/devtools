<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Rounded App Icon Background -->
  <rect width="100" height="100" rx="22" fill="#141a24"/>
  
  <!-- Background Code Lines (Teal/Mint) -->
  <rect x="10" y="23" width="22" height="4.5" rx="2.25" fill="#2dd4bf"/>
  <rect x="19" y="33" width="12" height="4.5" rx="2.25" fill="#2dd4bf"/>
  <rect x="19" y="43" width="6" height="4.5" rx="2.25" fill="#2dd4bf"/>
  <rect x="19" y="58" width="16" height="4.5" rx="2.25" fill="#2dd4bf"/>
  <rect x="18" y="68" width="18" height="4.5" rx="2.25" fill="#2dd4bf"/>
  <rect x="71" y="32" width="14" height="4.5" rx="2.25" fill="#2dd4bf"/>
  
  <!-- Magnifying Glass Lens Fill -->
  <circle cx="48" cy="46" r="23" fill="#17212e"/>
  
  <!-- Lens Code Details -->
  <!-- Top-left reflection highlight -->
  <path d="M 36 43 A 15 15 0 0 1 47 33" fill="none" stroke="#fef9c3" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  
  <!-- White code bar inside lens -->
  <rect x="43" y="41" width="17" height="4.5" rx="1.5" fill="#ffffff"/>
  
  <!-- Teal code bar inside lens -->
  <rect x="35" y="50" width="17" height="4.5" rx="1.5" fill="#2dd4bf"/>
  
  <!-- Magnifying Glass Rim -->
  <circle cx="48" cy="46" r="23" fill="none" stroke="#f8fafc" stroke-width="7.5"/>
  
  <!-- Magnifying Glass Handle -->
  <path d="M 64.5 62.5 L 82.5 80.5" stroke="#f8fafc" stroke-width="8.5" stroke-linecap="round"/>
</svg>
